<!DOCTYPE html>
<html lang="en-GB">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="UK-TAG" content="UK-SM">

    <title>WebSocket Client</title>

    <!-- ----- JAVASCRIPT ---------------------------------------- -->
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>

    <script src="js/websocketlib.js"></script>
    <script src="js/class_console.js"></script>
    <script src="js/client.js"></script>

    <!-- ----- CSS ----------------------------------------------- -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link href="css/main.css" rel="stylesheet">
</head>

<body>
    <div id="content" class="content container" role="main">
        <div class="container">
            <div id="masthead">
                <h1 id="pagehead" class="pghead">ws_client</h1>
            </div>
        </div>

        <div class="container">

            <div class="row">
                <div class="col-6">
                    <button type="button" id="wsConnect" class="ctrlBtn idle">connect</button>
                </div>
                <div class="col-6">
                    <button type="button" id="status" class="ctrlBtn">status</button>
                </div>
            </div>

            <div class="row">
                <div class="col-6">
                    <input type="text" class="form-control" id="wsSendMsg">
                </div>
                <div class="col-6">
                    <button type="button" id="wsSend" class="ctrlBtn">send</button>
                </div>
            </div>

            <div id="console-container" class="row console-row">
                <div class="col-12">
                    <div id="console" class="console-box" autocomplete="off">
                    </div>
                </div>
            </div>

        </div><!-- /.container -->

    </div>
</body>

</html>
